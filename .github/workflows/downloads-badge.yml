name: Update Combined Downloads Badge

on:
  schedule:
    - cron: '0 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch crates.io + GitHub Releases downloads and build badge JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          gh_token = os.environ["GH_TOKEN"]

          # 1. Crates.io downloads
          crates_req = urllib.request.Request(
              "https://crates.io/api/v1/crates/ebook-rs",
              headers={"User-Agent": f"{repo}-downloads-badge/1.0 (https://github.com/{repo})"},
          )
          crates_downloads = 0
          try:
              with urllib.request.urlopen(crates_req, timeout=20) as resp:
                  data = json.load(resp)
                  crates_downloads = int(data.get("crate", {}).get("downloads", 0))
          except Exception as exc:
              print(f"Warning: failed to fetch crates.io stats: {exc}")

          # 2. GitHub Releases asset downloads (includes cargo-binstall + direct downloads)
          gh_downloads = 0
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              gh_req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": f"{repo}-downloads-badge/1.0",
                  },
              )
              with urllib.request.urlopen(gh_req, timeout=20) as resp:
                  releases = json.load(resp)
              if not releases:
                  break
              for rel in releases:
                  for asset in rel.get("assets", []):
                      gh_downloads += int(asset.get("download_count", 0))
              if len(releases) < 100:
                  break
              page += 1

          total = crates_downloads + gh_downloads

          def fmt_count(n: int) -> str:
              if n >= 1_000_000:
                  return f"{n / 1_000_000:.1f}M"
              if n >= 1_000:
                  return f"{n / 1_000:.1f}k"
              return str(n)

          badge = {
              "schemaVersion": 1,
              "label": "downloads",
              "message": fmt_count(total),
              "color": "blue",
          }
          os.makedirs("badge-out", exist_ok=True)
          with open("badge-out/downloads.json", "w", encoding="utf-8") as f:
              json.dump(badge, f, indent=2)
              f.write("\n")

          print(f"crates.io={crates_downloads}, github_releases={gh_downloads}, total={total} ({badge['message']})")
          PY

      - name: Publish downloads.json to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TMP_DIR=$(mktemp -d)
          cp badge-out/downloads.json "$TMP_DIR/downloads.json"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$TMP_DIR/downloads.json" downloads.json
          git add downloads.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(badge): update combined downloads count"
            git push origin badges
          else
            echo "No change in downloads count; skipping push."
          fi
