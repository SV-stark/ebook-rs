name: Publish Python Wheels to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --features python --strip
          sdist: ${{ matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64' }}

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: target/wheels/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive *
