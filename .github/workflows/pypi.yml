name: Publish Python Wheels to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Never run two publishes at once; PyPI rejects duplicate filenames.
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --features python --strip

      # maturin-action@v1 has no `sdist` input (it was silently ignored), so the
      # sdist is built as its own step. It lands in target/wheels and is uploaded
      # with the linux-x86_64 artifact.
      - name: Build sdist
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out target/wheels

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: target/wheels/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels]
    # Trusted Publishing: maturin exchanges this OIDC token for a short-lived
    # PyPI API token. No PYPI_API_TOKEN secret is needed (or wanted).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          # --skip-existing makes re-runs after a partial upload idempotent.
          args: --non-interactive --skip-existing *
