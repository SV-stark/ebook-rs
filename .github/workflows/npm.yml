name: Publish to npm

on:
  # Publishing is driven by the GitHub Release so that the npm version, the
  # PyPI version and the release notes all come from the same tag. The old
  # `push: tags` trigger is intentionally gone: together with `release` it
  # produced two concurrent publishes per release, and the loser failed.
  release:
    types: [published]
  workflow_dispatch:

# Never run two publishes at once; npm rejects duplicate versions.
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The registry rejects the unscoped name `ebook-rs` with
  # `400 Bad Request - That word is not allowed`, so the package lives under
  # the user scope. wasm-pack regenerates pkg/package.json on every build and
  # ignores [package.metadata.wasm-pack.package], so the name is patched here.
  NPM_PACKAGE_NAME: '@svstark/ebook-rs'
  NPM_REPOSITORY_URL: 'https://github.com/SV-stark/ebook-rs'

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) and for the provenance
      # attestation npm attaches to the tarball.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WebAssembly package
        run: wasm-pack build --target web --out-dir pkg -- --no-default-features --features wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # wasm-pack derives `name` from the crate name and ignores the
      # [package.metadata.wasm-pack.package] table in Cargo.toml.
      - name: Fix package manifest for npm
        working-directory: pkg
        run: |
          npm pkg set "name=$NPM_PACKAGE_NAME"
          npm pkg set "repository.type=git" "repository.url=$NPM_REPOSITORY_URL"

      - name: Show package manifest
        working-directory: pkg
        run: |
          node -e "const p=require('./package.json'); console.log(p.name + '@' + p.version); console.log('repository:', p.repository && p.repository.url)"

      # No NODE_AUTH_TOKEN and no NPM_TOKEN: the npm CLI detects the GitHub
      # Actions OIDC environment and exchanges the ID token for short-lived
      # publish credentials (npm Trusted Publishing).
      - name: Publish to npm
        working-directory: pkg
        run: npm publish --access public
