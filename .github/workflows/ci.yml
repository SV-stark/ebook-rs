name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The binary and the library share an output filename on MSVC (cargo normalizes
      # `ebook-rs` -> `ebook_rs`, colliding with the `ebook_rs` lib PDB). Building lib, bin,
      # tests and examples in one `cargo test --all-targets` invocation could then fail
      # intermittently with:
      #   crate `write_fonts` required to be available in rlib format, but was not found in this form
      # Building the binary separately keeps test compilation deterministic.
      - name: Run Tests
        run: cargo test --lib --tests --all-features --no-fail-fast

      - name: Build Binary
        run: cargo build --all-features --bins

      - name: Build Examples
        run: cargo build --all-features --examples

      - name: Dependency Vulnerability Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Random 25 Project Gutenberg Books Stress Test
        run: |
          chmod +x scripts/fetch_gutenberg.sh
          ./scripts/fetch_gutenberg.sh 25 corpus/ci_gutenberg --random
          cargo run --release --all-features --example corpus_stress -- corpus/ci_gutenberg

      - name: Install wasm-pack & Target
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh || cargo install wasm-pack || true

      - name: Build & Check WASM
        run: |
          wasm-pack test --node -- --no-default-features --features wasm || cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
          wasm-pack build --target web --out-dir pkg -- --no-default-features --features wasm