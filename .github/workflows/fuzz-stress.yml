name: Continuous Real-World Corpus Stress & Fuzzing

on:
  schedule:
    - cron: '0 4 * * 0' # Every Sunday at 04:00 UTC
  workflow_dispatch:

jobs:
  corpus-stress-test:
    name: Real-World Corpus & Corruption Stress Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Project Gutenberg Corpus
        id: cache-gutenberg
        uses: actions/cache@v4
        with:
          path: corpus/gutenberg
          key: gutenberg-corpus-v1

      - name: Fetch Project Gutenberg Books
        run: |
          chmod +x scripts/fetch_gutenberg.sh
          ./scripts/fetch_gutenberg.sh 25 corpus/gutenberg

      - name: Run Sample Suite Stress Test
        run: |
          echo "## 🧪 Local Golden Sample Stress Test" >> $GITHUB_STEP_SUMMARY
          cargo run --release --all-features --example corpus_stress -- samples > sample_report.md
          cat sample_report.md >> $GITHUB_STEP_SUMMARY

      - name: Run Project Gutenberg Mass Stress Test
        run: |
          echo -e "\n## 📚 Project Gutenberg Mass Stress Test (25 Real-World Classics)" >> $GITHUB_STEP_SUMMARY
          cargo run --release --all-features --example corpus_stress -- corpus/gutenberg > gutenberg_report.md
          cat gutenberg_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Stress Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-reports
          path: |
            sample_report.md
            gutenberg_report.md

  mutation-fuzzing:
    name: 10-Minute Continuous libFuzzer Mutation Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed Fuzz Corpus
        run: |
          mkdir -p fuzz/corpus/fuzz_from_bytes
          # Seed with sample files up to 256KB to prime coverage-guided mutation engine
          for file in samples/*; do
            if [ -f "$file" ]; then
              head -c 262144 "$file" > "fuzz/corpus/fuzz_from_bytes/$(basename "$file")" || true
            fi
          done

      - name: Run Coverage-Guided Fuzzing (10 minutes)
        run: |
          cd fuzz
          cargo +nightly fuzz run fuzz_from_bytes -- -max_total_time=600 -rss_limit_mb=4096
