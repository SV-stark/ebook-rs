[package]
name = "ebook-rs"
version = "0.8.0"
edition = "2024"
authors = ["SV-Stark"]
description = "Pure Rust multi-format eBook engine (EPUB2/3, MOBI, AZW3, FB2, LIT, CBZ, PDF, ODT, TXT, MD) with CFI, Tree-sitter Code Parser, Regex Search, EPUB Validator, Readium LCP/Locator, Book Fingerprinting, and Citation Export APIs."
license = "MIT"
repository = "https://github.com/SV-stark/ebook-rs"
homepage = "https://github.com/SV-stark/ebook-rs"
readme = "README.md"
exclude = ["samples/*"]
keywords = ["epub", "reader", "ebook", "parser", "cfi"]
categories = ["parsing", "web-programming"]

[lib]
name = "ebook_rs"
path = "src/lib.rs"

[[bin]]
name = "ebook-rs"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server", "opds", "parallel"]
server = ["dep:tiny_http", "dep:url"]
wasm = ["dep:wasm-bindgen"]
opds = []
parallel = ["dep:rayon"]
pdf = ["dep:pdf_oxide"]

[dependencies]
zip = "8.6"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
percent-encoding = "2.3"
tiny_http = { version = "0.12", optional = true }
url = { version = "2.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
rayon = { version = "1.10", optional = true }
pdf_oxide = { version = "0.3", optional = true }
regex = "1.10"
