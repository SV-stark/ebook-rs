[package]
name = "ebook-rs"
version = "0.16.1"
edition = "2024"
authors = ["SV-Stark"]
description = "Pure Rust multi-format eBook engine (EPUB 2/3, MOBI, AZW3, KFX, FB2, LIT, CBZ, PDF, ODT, DOCX, RTF, TXT, MD) featuring Mozilla UniFFI, Readium CFI/LCP, SpeechSynthesis TTS sync, CJK vertical/RTL reflow, EPUB3 optimizer, AI RAG BM25 chunking, zero-copy search, Zstd caching, Python/WASM bindings, and native MCP server."
license = "MIT"
repository = "https://github.com/SV-stark/ebook-rs"
homepage = "https://github.com/SV-stark/ebook-rs"
readme = "README.md"
exclude = ["samples/*"]
keywords = ["epub", "reader", "ebook", "parser", "cfi"]
categories = ["parsing", "web-programming"]

[package.metadata.wasm-pack.package]
name = "ebook-rs-wasm"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "ebook_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ebook-rs"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server", "opds", "parallel", "mmap", "serde", "zstd", "mcp"]
mcp = ["serde", "dep:serde_json"]
server = ["dep:tiny_http", "dep:url"]
wasm = ["dep:wasm-bindgen", "dep:getrandom", "serde"]
python = ["dep:pyo3"]
opds = []
parallel = ["dep:rayon"]
pdf = ["dep:pdf_oxide"]
mmap = ["dep:memmap2"]
async = ["dep:tokio"]
mimalloc = ["dep:mimalloc"]
serde = ["dep:serde", "dep:serde_json"]
uniffi = ["dep:uniffi", "serde"]
zstd = ["dep:zstd"]

[dependencies]
uniffi = { version = "0.28", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
base64 = "0.23"
percent-encoding = "2.3"
tiny_http = { version = "0.12", optional = true }
url = { version = "2.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
rayon = { version = "1.10", optional = true }
pdf_oxide = { version = "0.3", optional = true }
memmap2 = { version = "0.9", optional = true }
tokio = { version = "1", features = ["rt", "fs", "io-util"], optional = true }
regex = "1.10"
compact_str = { version = "0.10", features = ["serde"] }
ahash = { version = "0.8", features = ["serde"] }
simdutf8 = "0.1"
zlib-rs = "0.6"
flate2 = { version = "1.0", features = ["zlib-rs"] }
memchr = "2.7"
parking_lot = "0.12"
encoding_rs = "0.8"
whatlang = "0.18"
zstd = { version = "0.13", optional = true }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
cipher = "0.5"
ion-rs = "1.0.0-rc.11"
sha1_smol = "1.0"
rdocx = { version = "0.7", default-features = false }


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
rpath = false
overflow-checks = false
