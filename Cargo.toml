[package]
name = "ebook-rs"
version = "0.18.0"
edition = "2024"
rust-version = "1.88"
authors = ["SV-Stark"]
description = "Pure Rust multi-format eBook engine (EPUB 2/3, MOBI, AZW3, KFX, FB2, LIT, CBZ, PDF, ODT, DOCX, RTF, TXT, MD) featuring Mozilla UniFFI, Readium CFI/LCP, SpeechSynthesis TTS sync, CJK vertical/RTL reflow, EPUB3 optimizer, AI RAG BM25 chunking, zero-copy search, Zstd caching, Python/WASM bindings, and native MCP server."
license = "MIT"
repository = "https://github.com/SV-stark/ebook-rs"
homepage = "https://github.com/SV-stark/ebook-rs"
readme = "README.md"
exclude = ["samples/*", "tests/test_real_samples_golden.rs"]
keywords = ["epub", "reader", "ebook", "parser", "cfi"]
categories = ["parsing", "web-programming"]

[package.metadata.wasm-pack.package]
name = "ebook-rs-wasm"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "ebook_rs"
path = "src/lib.rs"
# `cdylib` is required by maturin (PyPI wheels) and wasm-pack (npm package), which inject
# `--crate-type cdylib` at build time. `rlib` is required by the binary, tests and examples.
crate-type = ["cdylib", "rlib"]

# NOTE: the binary target is intentionally named `ebook-rs` (the documented CLI surface). Cargo
# normalizes `-` to `_` when naming debug artifacts, so on MSVC this collides with the `ebook_rs`
# lib target's PDB (`warning: output filename collision at .../ebook_rs.pdb`). Building the lib,
# the binary and the integration tests in one `cargo` invocation can then fail intermittently with
# `crate `write_fonts` required to be available in rlib format`. CI therefore builds the binary
# separately from the test targets (see .github/workflows/ci.yml).
[[bin]]
name = "ebook-rs"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server", "opds", "parallel", "mmap", "serde", "zstd", "mcp"]
mcp = []
server = ["dep:tiny_http", "dep:url"]
wasm = ["dep:wasm-bindgen", "dep:getrandom"]
python = ["dep:pyo3"]
opds = []
parallel = ["dep:rayon"]
pdf = ["dep:unpdf"]
mmap = ["dep:memmap2"]
async = ["dep:tokio"]
mimalloc = ["dep:mimalloc"]
serde = []
uniffi = ["dep:uniffi"]
zstd = ["dep:zstd"]

[dependencies]
uniffi = { version = "0.28", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
percent-encoding = "2.3"
tiny_http = { version = "0.12", optional = true }
url = { version = "2.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
rayon = { version = "1.12", optional = true }
unpdf = { version = "0.51", default-features = false, features = ["fast-parse", "refine"], optional = true }
memmap2 = { version = "0.9", optional = true }
tokio = { version = "1", features = ["rt", "fs", "io-util"], optional = true }
regex = "1.13"
compact_str = { version = "0.10", features = ["serde"] }
ahash = { version = "0.8", features = ["serde"] }
simdutf8 = "0.1"
zlib-rs = "0.6"
flate2 = { version = "1.1", features = ["zlib-rs"] }
memchr = "2.8"
parking_lot = "0.12"
encoding_rs = "0.8"
whatlang = "0.18"
zstd = { version = "0.13", optional = true }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
sha1_smol = "1.0"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
rpath = false
overflow-checks = true

