[package]
name = "ebook-rs"
version = "0.12.0"
edition = "2024"
authors = ["SV-Stark"]
description = "Pure Rust multi-format eBook engine (EPUB2/3, MOBI, AZW3, FB2, LIT, CBZ, PDF, ODT, TXT, MD) with SpeechSynthesis TTS Word Synchronizer, Legacy Charset Decoding, Auto Language Detection, Zstd State Caching, Universal EPUB3 Exporter, Zero-Copy mmap, and Readium LCP/Locator APIs."
license = "MIT"
repository = "https://github.com/SV-stark/ebook-rs"
homepage = "https://github.com/SV-stark/ebook-rs"
readme = "README.md"
exclude = ["samples/*"]
keywords = ["epub", "reader", "ebook", "parser", "cfi"]
categories = ["parsing", "web-programming"]

[lib]
name = "ebook_rs"
path = "src/lib.rs"

[[bin]]
name = "ebook-rs"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server", "opds", "parallel", "mmap", "serde"]
server = ["dep:tiny_http", "dep:url"]
wasm = ["dep:wasm-bindgen"]
opds = []
parallel = ["dep:rayon"]
pdf = ["dep:pdf_oxide"]
mmap = ["dep:memmap2"]
async = ["dep:tokio"]
mimalloc = ["dep:mimalloc"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
mimalloc = { version = "0.1", optional = true, default-features = false }
zip = "8.6"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
base64 = "0.23"
percent-encoding = "2.3"
tiny_http = { version = "0.12", optional = true }
url = { version = "2.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
rayon = { version = "1.10", optional = true }
pdf_oxide = { version = "0.3", optional = true }
memmap2 = { version = "0.9", optional = true }
tokio = { version = "1", features = ["rt", "fs", "io-util"], optional = true }
regex = "1.10"
compact_str = { version = "0.10", features = ["serde"] }
ahash = { version = "0.8", features = ["serde"] }
simdutf8 = "0.1"
zlib-rs = "0.6"
flate2 = { version = "1.0", features = ["zlib-rs"] }
memchr = "2.7"
parking_lot = "0.12"
encoding_rs = "0.8"
whatlang = "0.18"
zstd = "0.13"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
cipher = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
rpath = false
overflow-checks = false
